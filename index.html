<title>Судоку для Полины</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pacifico&display=swap">
<style>
/* Layout: one centered 9x9 board, photo tiles with big digits, palette dock below, cat as the hint button, hearts drifting behind. */
:root{
  --bg:#fff1f3; --card:#ffffff; --ink:#4a1d2f; --muted:#9a6a7a;
  --rose:#e8456b; --rose-soft:#ffd6df; --line:#f0b9c6; --bold-line:#d9647f;
  --given:#fde3e9; --sel:#fff3b8; --bad:#d62b4b;
  --font-display:'Pacifico','Marck Script',cursive;
  --font-body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a1220; --card:#3a1a2d; --ink:#ffe3ea; --muted:#d79bad;
  --rose:#ff6b8f; --rose-soft:#5a2740; --line:#6d3350; --bold-line:#ff8aa5;
  --given:#4d2238; --sel:#6b5a2a; --bad:#ff5a78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1220; --card:#3a1a2d; --ink:#ffe3ea; --muted:#d79bad;
  --rose:#ff6b8f; --rose-soft:#5a2740; --line:#6d3350; --bold-line:#ff8aa5;
  --given:#4d2238; --sel:#6b5a2a; --bad:#ff5a78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;overflow-x:hidden;position:relative}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts i{position:absolute;bottom:-40px;color:var(--rose);opacity:.18;animation:up linear infinite;font-style:normal}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:stretch}
h1{font-family:var(--font-display);font-weight:400;font-size:1.8rem;margin:0;color:var(--rose);text-align:center;text-wrap:balance}
.sub{margin:0;text-align:center;color:var(--muted);font-size:.85rem}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--rose-soft)}
.lvl button{font-family:inherit;font-weight:800;font-size:.95rem;padding:9px 6px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;min-width:0}
.lvl button[aria-pressed="true"]{background:var(--rose);color:#fff;box-shadow:0 3px 10px -4px var(--rose)}
.lvl button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat{font-weight:800;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--rose)}
.board{display:grid;grid-template-columns:repeat(9,1fr);background:var(--card);border:3px solid var(--bold-line);border-radius:16px;overflow:hidden;aspect-ratio:1;box-shadow:0 10px 30px -12px var(--rose)}
.cell{position:relative;border:0;padding:0;margin:0;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:grid;place-items:center;min-width:0}
.cell:nth-child(3n){border-right:2.5px solid var(--bold-line)}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+73){border-bottom:0}
.cell.given{background:var(--given)}
.cell.sel{background:var(--sel)}
.cell.peer{background:var(--rose-soft)}
.cell:focus-visible{outline:3px solid var(--rose);outline-offset:-3px;z-index:2}
.sym{width:94%;aspect-ratio:1;border-radius:50%;background-repeat:no-repeat;background-color:var(--rose-soft);border:1.5px solid var(--card);box-shadow:0 0 0 1.5px var(--rose);position:relative}
.cell.bad .sym{box-shadow:0 0 0 2.5px var(--bad)}
.cell.bad::after{content:"";position:absolute;inset:2px;border-radius:8px;border:2px dashed var(--bad);pointer-events:none}
.num{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.3) 0,rgba(0,0,0,0) 72%);color:#fff;font-size:clamp(1.1rem,6.4vw,1.9rem);font-weight:800;line-height:1;display:grid;place-items:center;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 8px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px;max-width:440px;width:100%;margin-inline:auto}
.dock .pal{flex:0 0 calc((100% - 32px)/5)}
.pal{position:relative;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;gap:3px;border-radius:14px;font-family:inherit;min-width:0}
.pal .sym{width:100%}
.pal .num{font-size:clamp(1.4rem,8.4vw,2.3rem)}
.pal small{font-weight:800;color:var(--ink);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pal.done .sym{opacity:.35}
.pal.done small{opacity:.5}
.pal:focus-visible,.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.pal:active .sym{transform:scale(.94)}
.zoom{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--rose);border:2px solid var(--rose);font-size:.85rem;font-weight:800;display:grid;place-items:center;line-height:1;z-index:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;font-family:inherit;font-weight:800;font-size:.95rem;padding:11px 12px;border-radius:999px;border:2px solid var(--rose);background:transparent;color:var(--rose);cursor:pointer}
.btn.main{background:var(--rose);color:#fff}
.cat{display:flex;align-items:center;gap:10px}
.cat .pal{width:64px;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:.9rem;font-weight:700;min-width:0}
.win{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:20px}
.win[hidden]{display:none!important}
.win .card{background:var(--card);border:3px solid var(--rose);border-radius:24px;padding:22px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.win .big{width:150px;aspect-ratio:1;border-radius:50%;background-repeat:no-repeat;border:4px solid var(--rose)}
.win h2{font-family:var(--font-display);font-weight:400;margin:0;color:var(--rose);font-size:1.6rem}
.win p{margin:0}
.lb{position:fixed;inset:0;z-index:6;background:rgba(20,6,12,.9);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb[hidden]{display:none!important}
.lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.lb img{max-width:100%;max-height:78vh;border-radius:18px;border:3px solid var(--rose);object-fit:contain}
.lb figcaption{color:#fff;font-weight:800;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.hearts i{animation:none}}
</style>

<div class="hearts" id="hearts" aria-hidden="true"></div>
<main>
  <h1>Судоку для Полины</h1>
  <p class="sub">В каждой строке, столбце и рамке 3×3 должны быть все девять лиц, без повторов</p>
  <div class="lvl" id="lvl" role="group" aria-label="Сложность">
    <button type="button" data-l="0" aria-pressed="false">Легко</button>
    <button type="button" data-l="1" aria-pressed="true">Средне</button>
    <button type="button" data-l="2" aria-pressed="false">Сложно</button>
  </div>
  <div class="top">
    <span class="stat">Пусто: <b id="left">0</b></span>
    <span class="stat">Ошибки: <b id="errs">0</b></span>
  </div>
  <div class="board" id="board" role="grid" aria-label="Поле судоку"></div>
  <div class="dock" id="dock"></div>
  <div class="row">
    <button class="btn" id="erase" type="button">Стереть</button>
    <button class="btn main" id="new" type="button">Новая игра</button>
  </div>
  <div class="cat">
    <button class="pal" id="hint" type="button" aria-label="Подсказка от кота"><span class="sym" id="catsym"></span></button>
    <div class="bubble" id="bubble">Мяу. Нажми на меня, если застряла, и я подскажу клетку.</div>
  </div>
</main>

<div class="lb" id="lb" hidden><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>
<div class="win" id="win" hidden>
  <div class="card">
    <div class="big" id="bigp"></div>
    <h2>Полина, ты сделала это!</h2>
    <p>Все лица на местах. Кот доволен.</p>
    <button class="btn main" id="again" type="button" style="flex:none;width:100%">Ещё раз</button>
  </div>
</div>

const $=id=>document.getElementById(id);
const N=9,BR=3,BC=3,T=N*N;
function openPhoto(v){$('lbimg').src=IM[SYM[v].k];$('lbcap').textContent='Лицо №'+(v+1);$('lb').hidden=false}
$('lb').onclick=()=>{$('lb').hidden=true};
const TARGET=[34,44,52];
let level=1;
try{const s=+localStorage.getItem('sudoku-polina-level');if(s>=0&&s<=2)level=s}catch(e){}
let sol,puz,cur,sel=-1,errs=0,given;
function syncLevel(){document.querySelectorAll('#lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.l===level)))}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeSolved(){
  const g=[],sy=shuffle([...Array(N).keys()]);
  const rb=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r));
  const cs=shuffle([0,1,2]).flatMap(s=>shuffle([0,1,2]).map(c=>s*3+c));
  for(const r of rb)for(const c of cs)g.push(sy[(3*(r%3)+Math.floor(r/3)+c)%N]);
  return g;
}
function ok(g,i,v){const r=Math.floor(i/N),c=i%N;
  for(let k=0;k<N;k++){if(k!==c&&g[r*N+k]===v)return false;if(k!==r&&g[k*N+c]===v)return false}
  const br=r-r%BR,bc=c-c%BC;
  for(let y=0;y<BR;y++)for(let x=0;x<BC;x++){const j=(br+y)*N+bc+x;if(j!==i&&g[j]===v)return false}
  return true}
function count(g,lim){
  let best=-1,bc=null;
  for(let i=0;i<T;i++){if(g[i]!==-1)continue;const c=[];for(let v=0;v<N;v++)if(ok(g,i,v))c.push(v);
    if(bc===null||c.length<bc.length){best=i;bc=c;if(c.length<2)break}}
  if(best<0)return 1;
  let n=0;for(const v of bc){g[best]=v;n+=count(g,lim-n);g[best]=-1;if(n>=lim)break}
  return n}
function newPuzzle(){
  sol=makeSolved();puz=sol.slice();
  let empty=0;
  for(const i of shuffle([...Array(T).keys()])){
    if(empty>=TARGET[level])break;
    const keep=puz[i];puz[i]=-1;
    if(count(puz.slice(),2)!==1)puz[i]=keep;else empty++}
  given=puz.map(v=>v>=0);cur=puz.slice();sel=-1;errs=0;
  $('bubble').textContent='Мяу. Нажми на меня, если застряла, и я подскажу клетку.';
  $('win').hidden=true;render();
}
function conflicts(){const bad=new Set();
  cur.forEach((v,i)=>{if(v>=0&&!ok(cur,i,v))bad.add(i)});return bad}
function render(){
  const b=$('board');b.innerHTML='';const bad=conflicts();
  const sr=sel>=0?Math.floor(sel/N):-1,sc=sel>=0?sel%N:-1;
  cur.forEach((v,i)=>{
    const r=Math.floor(i/N),c=i%N;
    const el=document.createElement('button');el.type='button';
    el.className='cell'+(given[i]?' given':'')+(i===sel?' sel':'')+(sel>=0&&i!==sel&&(r===sr||c===sc)?' peer':'')+(bad.has(i)?' bad':'');
    if(r%BR===BR-1&&r<N-1)el.style.borderBottom='2.5px solid var(--bold-line)';
    el.setAttribute('role','gridcell');el.setAttribute('aria-label','Клетка '+(r+1)+'-'+(c+1)+(v>=0?', лицо '+(v+1):', пусто'));
    if(v>=0){const s=document.createElement('span');s.className='sym';paint(s,v);const n=document.createElement('span');n.className='num';n.textContent=v+1;s.appendChild(n);el.appendChild(s)}
    el.onclick=()=>{sel=i;render();if(v>=0)openPhoto(v)};
    b.appendChild(el);
  });
  $('left').textContent=cur.filter(v=>v<0).length;$('errs').textContent=errs;
  const used=Array(N).fill(0);cur.forEach(v=>{if(v>=0)used[v]++});
  document.querySelectorAll('.pal[data-v]').forEach(p=>{const v=+p.dataset.v;p.classList.toggle('done',used[v]>=N);p.querySelector('small').textContent=used[v]>=N?'все ✓':'ещё '+(N-used[v])});
  if(!cur.includes(-1)&&bad.size===0)win();
}
function place(v){
  if(sel<0||given[sel])return;
  if(v>=0&&sol[sel]!==v)errs++;
  cur[sel]=v;render();
}
function win(){paint($('bigp'),0);$('win').hidden=false;burst()}
function burst(){const h=$('hearts');for(let i=0;i<30;i++)addHeart(h,true)}
function addHeart(h,fast){const s=document.createElement('i');s.textContent='♥';
  s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*34)+'px';
  s.style.animationDuration=(fast?3+Math.random()*3:9+Math.random()*10)+'s';
  s.style.animationDelay=(fast?Math.random()*1.5:-Math.random()*12)+'s';
  if(fast)s.style.opacity=.5;h.appendChild(s);if(fast)setTimeout(()=>s.remove(),8000)}
(function(){const h=$('hearts');for(let i=0;i<16;i++)addHeart(h,false)})();

const dock=$('dock');
SYM.forEach((_,i)=>{const p=document.createElement('button');p.type='button';p.className='pal';p.dataset.v=i;p.setAttribute('aria-label','Лицо '+(i+1));
  const s=document.createElement('span');s.className='sym';paint(s,i);const n=document.createElement('span');n.className='num';n.textContent=i+1;s.appendChild(n);
  const sm=document.createElement('small');const z=document.createElement('span');z.className='zoom';z.textContent='⤢';z.setAttribute('role','button');z.setAttribute('aria-label','Открыть фото '+(i+1));z.onclick=ev=>{ev.stopPropagation();openPhoto(i)};
  p.append(s,sm,z);p.onclick=()=>place(i);dock.appendChild(p)});
paint($('catsym'),5);
$('erase').onclick=()=>place(-1);
$('new').onclick=newPuzzle;$('again').onclick=newPuzzle;
const msgs=['Мяу! Эту клетку я бы занял так.','Мрр. Вот сюда, смотри.','Тут точно это лицо. Мяу.','Подсказываю лапой. Мррр.'];
$('hint').onclick=()=>{
  let t=sel>=0&&!given[sel]&&cur[sel]!==sol[sel]?sel:-1;
  if(t<0){const e=cur.map((v,i)=>v<0||v!==sol[i]?i:-1).filter(i=>i>=0);if(!e.length)return;t=e[Math.floor(Math.random()*e.length)]}
  sel=t;cur[t]=sol[t];$('bubble').textContent=msgs[Math.floor(Math.random()*msgs.length)];render()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('lb').hidden=true;return}
  if(e.key>='1'&&e.key<='9')place(+e.key-1);
  else if(e.key==='Backspace'||e.key==='Delete')place(-1);
  else if(sel>=0){const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-N,ArrowDown:N}[e.key];if(d){const n=sel+d;if(n>=0&&n<T&&!(Math.abs(d)===1&&Math.floor(n/N)!==Math.floor(sel/N))){sel=n;render();e.preventDefault()}}}
});
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{level=+b.dataset.l;try{localStorage.setItem('sudoku-polina-level',level)}catch(e){}syncLevel();newPuzzle()});
syncLevel();newPuzzle();
</script>
